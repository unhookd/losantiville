openapi: "3.1.0"
info:
  title: Minimal API
  version: v1
paths:
  /items:
    get:
      summary: List items
      responses:
        "200":
          description: A list of items
    post:
      summary: Create an item
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
  /empty:
    get:
      summary: Empty endpoint
      responses:
        "204":
          description: No content
